<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>Technical drawing: car on a two-post lift (placeholder for a workshop photo)</title>
  <defs>
    <pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="12" stroke="#4a4540" stroke-width="1"/>
    </pattern>
  </defs>
  <g stroke="#57514b" stroke-width="1">
    <line x1="40" y1="90" x2="760" y2="90" stroke-dasharray="2 6"/>
    <line x1="40" y1="510" x2="760" y2="510" stroke-dasharray="2 6"/>
  </g>
  <rect x="40" y="470" width="720" height="26" fill="url(#h)"/>
  <line x1="40" y1="470" x2="760" y2="470" stroke="#8d857c" stroke-width="2"/>

  <!-- lift posts -->
  <g stroke="#8d857c" stroke-width="2">
    <rect x="96" y="120" width="30" height="350"/>
    <rect x="674" y="120" width="30" height="350"/>
    <line x1="111" y1="130" x2="111" y2="460" stroke-dasharray="4 6" stroke="#57514b" stroke-width="1"/>
    <line x1="689" y1="130" x2="689" y2="460" stroke-dasharray="4 6" stroke="#57514b" stroke-width="1"/>
  </g>
  <!-- lift arms (accent) -->
  <g stroke="#e8751a" stroke-width="3">
    <path d="M126 384 L232 384 M226 376 h24 v8"/>
    <path d="M674 384 L560 384 M542 376 h24 v8"/>
    <rect x="100" y="370" width="22" height="28" fill="#e8751a" fill-opacity=".15"/>
    <rect x="678" y="370" width="22" height="28" fill="#e8751a" fill-opacity=".15"/>
  </g>

  <!-- car body -->
  <g stroke="#ece6dc" stroke-width="2.2">
    <path d="M150 352 L150 322 Q152 306 172 302 L252 292 Q304 236 366 226 L500 224 Q548 228 590 284 L642 294 Q664 298 666 318 L666 352 L614 352 A54 54 0 0 0 506 352 L304 352 A54 54 0 0 0 196 352 Z"/>
    <path d="M272 290 Q316 244 366 236 L424 235 L424 288 Z"/>
    <path d="M436 235 L498 235 Q532 240 562 286 L436 288 Z"/>
    <line x1="430" y1="296" x2="430" y2="350"/>
    <line x1="392" y1="306" x2="410" y2="306"/>
    <line x1="470" y1="306" x2="488" y2="306"/>
    <circle cx="250" cy="352" r="44"/>
    <circle cx="560" cy="352" r="44"/>
    <circle cx="250" cy="352" r="18" stroke="#8d857c"/>
    <circle cx="560" cy="352" r="18" stroke="#8d857c"/>
  </g>
  <!-- brake disc detail -->
  <circle cx="560" cy="352" r="30" stroke="#e8751a" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- dimension lines -->
  <g stroke="#8d857c" stroke-width="1" font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#a59d93">
    <line x1="150" y1="160" x2="666" y2="160"/>
    <line x1="150" y1="152" x2="150" y2="168"/>
    <line x1="666" y1="152" x2="666" y2="168"/>
    <text x="408" y="150" text-anchor="middle" stroke="none">4 512</text>
    <line x1="730" y1="396" x2="730" y2="470"/>
    <line x1="722" y1="396" x2="738" y2="396"/>
    <line x1="722" y1="470" x2="738" y2="470"/>
    <text x="744" y="438" stroke="none">1 800</text>
    <line x1="560" y1="352" x2="620" y2="420" stroke="#e8751a"/>
    <text x="626" y="432" stroke="none" fill="#e8751a">BRAKE DISC</text>
    <text x="96" y="110" stroke="none">LIFT 3.5 t</text>
  </g>
  <g font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#6f6860">
    <text x="40" y="540">BAY 02</text>
    <text x="760" y="540" text-anchor="end">SCALE 1:20</text>
  </g>
</svg>
